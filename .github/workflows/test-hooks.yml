name: Test Hooks
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Make scripts executable
        run: chmod +x claude-config/hooks/*.sh tests/test-hooks.sh
      - name: Run hook tests
        run: ./tests/test-hooks.sh
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests
        shell: powershell
        run: .\tests\test-hooks.ps1
